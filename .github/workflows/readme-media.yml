name: Generate SOC-DarkWatch README GIF
on:
  push:
    branches: [upgrade/audit-ready-visuals]
    paths: ["scripts/generate_visuals.py", ".github/workflows/readme-media.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=10,<13"
      - run: python scripts/generate_visuals.py
      - name: Commit generated GIF
        run: |
          git add assets/darkwatch-workflow.gif
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: add animated defensive SOC-DarkWatch walkthrough"
          git push
